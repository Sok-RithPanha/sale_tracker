<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sale & Expense Tracker</title>
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <!-- Firebase Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="bg-white rounded-xl shadow p-6 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800">Sale & Expense Tracker</h1>
        </header>

        <!-- Monthly Summary Dashboard -->
        <section class="bg-white rounded-xl shadow p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold">Monthly Summary</h2>
                <input type="month" id="monthFilter" class="border p-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-green-50 p-4 rounded-lg border border-green-100">
                    <p class="text-sm text-green-600 font-bold uppercase tracking-wider">Total Revenue</p>
                    <p class="text-3xl font-bold text-green-700 mt-2" id="summaryRevenue">$0.00</p>
                </div>
                <div class="bg-red-50 p-4 rounded-lg border border-red-100">
                    <p class="text-sm text-red-600 font-bold uppercase tracking-wider">Total Expenses</p>
                    <p class="text-3xl font-bold text-red-700 mt-2" id="summaryExpense">$0.00</p>
                </div>
                <div class="bg-blue-50 p-4 rounded-lg border border-blue-100">
                    <p class="text-sm text-blue-600 font-bold uppercase tracking-wider">Net Balance</p>
                    <p class="text-3xl font-bold text-blue-700 mt-2" id="summaryBalance">$0.00</p>
                </div>
            </div>
        </section>

        <!-- Actions -->
        <section class="flex gap-4">
            <button onclick="toggleForm('revenue')" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-bold shadow transition">
                + Log Sales Revenue
            </button>
            <button onclick="toggleForm('expense')" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-3 rounded-xl font-bold shadow transition">
                - Log Expense
            </button>
        </section>

        <!-- Input Form (Hidden by default) -->
        <section id="entryFormSection" class="bg-white rounded-xl shadow p-6 hidden transition-all">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold" id="formTitle">Add New Entry</h2>
                <button onclick="closeForm()" class="text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
            </div>
            
            <form id="trackerForm" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="hidden" id="entryType">
                
                <div class="flex flex-col">
                    <label class="text-sm font-semibold text-gray-600 mb-1">Date</label>
                    <input type="date" id="entryDate" required class="border p-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div class="flex flex-col md:col-span-2">
                    <label class="text-sm font-semibold text-gray-600 mb-1" id="nameLabel">Item / Service Name</label>
                    <input type="text" id="entryName" placeholder="e.g., Web Design Service" required class="border p-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div class="flex flex-col">
                    <label class="text-sm font-semibold text-gray-600 mb-1">Amount ($)</label>
                    <input type="number" id="entryAmount" step="0.01" min="0" placeholder="0.00" required class="border p-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="md:col-span-4 mt-2">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-bold shadow transition" id="submitBtn">Save Entry</button>
                </div>
            </form>
        </section>

        <!-- Records Table -->
        <section class="bg-white rounded-xl shadow overflow-hidden">
            <div class="p-6 border-b">
                <h2 class="text-xl font-semibold">Transaction Records</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 border-b text-sm uppercase tracking-wide">
                            <th class="p-4 font-semibold">Date</th>
                            <th class="p-4 font-semibold">Type</th>
                            <th class="p-4 font-semibold">Description</th>
                            <th class="p-4 font-semibold text-right">Amount</th>
                            <th class="p-4 font-semibold text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-100">
                        <!-- Rows will be populated by JavaScript -->
                    </tbody>
                </table>
                <div id="emptyState" class="p-8 text-center text-gray-500 hidden">
                    No transactions found for this month.
                </div>
            </div>
        </section>

    </div>

    <script>
        // 1. FIREBASE CONFIGURATION
        // TODO: Replace "YOUR_API_KEY_HERE" with your actual Web API Key from Project Settings

// Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCGtoOaSkXJ9Tfu3r777GKQ7R41LDJH7r4",
  authDomain: "saletracker-76738.firebaseapp.com",
  databaseURL: "https://saletracker-76738-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "saletracker-76738",
  storageBucket: "saletracker-76738.firebasestorage.app",
  messagingSenderId: "999245882616",
  appId: "1:999245882616:web:486ada83381a085a2b070d",
  measurementId: "G-V7HFXNMH46"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);

        // 2. STATE & DOM ELEMENTS
        let currentTransactions = [];
        
        const formSection = document.getElementById('entryFormSection');
        const trackerForm = document.getElementById('trackerForm');
        const formTitle = document.getElementById('formTitle');
        const nameLabel = document.getElementById('nameLabel');
        const submitBtn = document.getElementById('submitBtn');
        const entryType = document.getElementById('entryType');
        const entryDate = document.getElementById('entryDate');
        const monthFilter = document.getElementById('monthFilter');
        const tableBody = document.getElementById('tableBody');
        const emptyState = document.getElementById('emptyState');

        // Set default month to current month
        const today = new Date();
        const currentMonthString = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
        monthFilter.value = currentMonthString;

        // 3. UI FUNCTIONS
        function toggleForm(type) {
            formSection.classList.remove('hidden');
            entryType.value = type;
            
            if (type === 'revenue') {
                formTitle.textContent = "Log Sales Revenue";
                nameLabel.textContent = "Product / Service Sold";
                submitBtn.className = "w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-bold shadow transition";
            } else {
                formTitle.textContent = "Log Expense";
                nameLabel.textContent = "Expense Item / Category";
                submitBtn.className = "w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded-lg font-bold shadow transition";
            }
            
            // Set default date to today
            entryDate.value = today.toISOString().split('T')[0];
        }

        function closeForm() {
            formSection.classList.add('hidden');
            trackerForm.reset();
        }

        // 4. FIREBASE DATA HANDLING
        
        // Save new entry
        trackerForm.addEventListener('submit', (e) => {
            e.preventDefault(); // Prevent page reload
            
            const newEntry = {
                type: document.getElementById('entryType').value,
                date: document.getElementById('entryDate').value,
                name: document.getElementById('entryName').value,
                amount: parseFloat(document.getElementById('entryAmount').value)
            };

            // Push to Firebase
            transactionsRef.push(newEntry)
                .then(() => {
                    closeForm();
                })
                .catch((error) => {
                    console.error("Error saving data: ", error);
                    alert("Could not save entry. Check your database rules.");
                });
        });

        // Delete entry
        window.deleteEntry = function(id) {
            if(confirm("Are you sure you want to delete this record?")) {
                transactionsRef.child(id).remove();
            }
        };

        // Listen for Realtime Updates from Firebase
        transactionsRef.on('value', (snapshot) => {
            const data = snapshot.val();
            currentTransactions = [];
            
            if (data) {
                // Convert Firebase object to array with IDs
                for (let id in data) {
                    currentTransactions.push({ id, ...data[id] });
                }
                // Sort by date descending (newest first)
                currentTransactions.sort((a, b) => new Date(b.date) - new Date(a.date));
            }
            
            updateDashboard();
        });

        // Handle Month Filter changes
        monthFilter.addEventListener('change', updateDashboard);

        // 5. UPDATE DASHBOARD & TABLE
        function updateDashboard() {
            const selectedMonth = monthFilter.value; // Format: "YYYY-MM"
            let totalRev = 0;
            let totalExp = 0;
            
            tableBody.innerHTML = '';
            let rowsAdded = 0;

            currentTransactions.forEach(tx => {
                // Extract YYYY-MM from transaction date
                const txMonth = tx.date.substring(0, 7);
                
                // Only process transactions for selected month
                if (txMonth === selectedMonth) {
                    rowsAdded++;
                    const isRevenue = tx.type === 'revenue';
                    
                    if (isRevenue) totalRev += tx.amount;
                    else totalExp += tx.amount;

                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-gray-50 transition";
                    tr.innerHTML = `
                        <td class="p-4 text-sm text-gray-600 whitespace-nowrap">${tx.date}</td>
                        <td class="p-4">
                            <span class="px-2 py-1 text-xs font-bold rounded-full ${isRevenue ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'} uppercase tracking-wide">
                                ${isRevenue ? 'Sale' : 'Expense'}
                            </span>
                        </td>
                        <td class="p-4 font-medium text-gray-800">${tx.name}</td>
                        <td class="p-4 text-right font-bold ${isRevenue ? 'text-green-600' : 'text-red-600'}">
                            ${isRevenue ? '+' : '-'}$${tx.amount.toFixed(2)}
                        </td>
                        <td class="p-4 text-center">
                            <button onclick="deleteEntry('${tx.id}')" class="text-red-400 hover:text-red-600 transition" title="Delete">
                                <!-- Trash Icon SVG -->
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                            </button>
                        </td>
                    `;
                    tableBody.appendChild(tr);
                }
            });

            // Toggle Empty State
            if (rowsAdded === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
            }

            // Update Summary Widgets
            document.getElementById('summaryRevenue').textContent = `$${totalRev.toFixed(2)}`;
            document.getElementById('summaryExpense').textContent = `$${totalExp.toFixed(2)}`;
            
            const balance = totalRev - totalExp;
            const balanceEl = document.getElementById('summaryBalance');
            balanceEl.textContent = `${balance >= 0 ? '' : '-'}$${Math.abs(balance).toFixed(2)}`;
            balanceEl.className = `text-3xl font-bold mt-2 ${balance >= 0 ? 'text-blue-700' : 'text-red-700'}`;
        }

    </script>
</body>
</html>

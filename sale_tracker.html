<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sale & Expense Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        /* Custom scrollbar for table */
        .table-container::-webkit-scrollbar {
            height: 8px;
        }
        .table-container::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        .table-container::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .table-container::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="showView('dashboard')">
                <div class="bg-blue-600 p-2 rounded-lg text-white">
                    <i class="fa-solid fa-chart-pie"></i>
                </div>
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-700 to-blue-500">
                    RTY
                </h1>
            </div>
            <div class="text-sm text-slate-500 flex items-center gap-2">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                Local Storage Active
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        
        <!-- ================= DASHBOARD VIEW ================= -->
        <div id="dashboard-view" class="space-y-6 block">
            
            <!-- Header & Filter -->
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <h2 class="text-2xl font-bold text-slate-800">Financial Overview</h2>
                <div class="flex items-center gap-2 bg-white p-2 rounded-lg shadow-sm border border-slate-200">
                    <i class="fa-regular fa-calendar text-slate-400 pl-2"></i>
                    <select id="month-filter" class="bg-transparent text-slate-700 outline-none font-medium pr-2 cursor-pointer" onchange="renderDashboard()">
                        <!-- Options populated by JS -->
                    </select>
                </div>
            </div>

            <!-- Summary Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Revenue Card -->
                <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-200 flex items-center space-x-4 transition-transform hover:-translate-y-1 duration-300">
                    <div class="p-4 bg-green-100 text-green-600 rounded-full">
                        <i class="fa-solid fa-arrow-trend-up text-xl"></i>
                    </div>
                    <div>
                        <p class="text-sm text-slate-500 font-medium">Monthly Revenue</p>
                        <p class="text-2xl font-bold text-slate-800" id="summary-revenue">$0.00</p>
                    </div>
                </div>
                
                <!-- Expense Card -->
                <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-200 flex items-center space-x-4 transition-transform hover:-translate-y-1 duration-300">
                    <div class="p-4 bg-red-100 text-red-600 rounded-full">
                        <i class="fa-solid fa-arrow-trend-down text-xl"></i>
                    </div>
                    <div>
                        <p class="text-sm text-slate-500 font-medium">Monthly Expenses</p>
                        <p class="text-2xl font-bold text-slate-800" id="summary-expense">$0.00</p>
                    </div>
                </div>

                <!-- Profit Card -->
                <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-200 flex items-center space-x-4 transition-transform hover:-translate-y-1 duration-300" id="profit-card">
                    <div class="p-4 rounded-full" id="profit-icon-container">
                        <i class="fa-solid fa-wallet text-xl" id="profit-icon"></i>
                    </div>
                    <div>
                        <p class="text-sm text-slate-500 font-medium">Net Profit</p>
                        <p class="text-2xl font-bold" id="summary-profit">$0.00</p>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-wrap gap-4 py-2">
                <button onclick="openForm('sale')" class="flex-1 min-w-[200px] flex items-center justify-center gap-2 bg-green-600 hover:bg-green-700 text-white py-3 px-6 rounded-xl font-medium transition-colors shadow-sm">
                    <i class="fa-solid fa-plus-circle"></i>
                    Add Sales Revenue
                </button>
                <button onclick="openForm('expense')" class="flex-1 min-w-[200px] flex items-center justify-center gap-2 bg-red-600 hover:bg-red-700 text-white py-3 px-6 rounded-xl font-medium transition-colors shadow-sm">
                    <i class="fa-solid fa-minus-circle"></i>
                    Add Expense
                </button>
            </div>

            <!-- Data Table -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mt-6">
                <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                    <h3 class="font-semibold text-slate-800" id="table-title">Transactions</h3>
                    <span class="text-xs font-medium bg-blue-100 text-blue-800 py-1 px-3 rounded-full" id="record-count">0 records</span>
                </div>
                <div class="overflow-x-auto table-container">
                    <table class="w-full text-left border-collapse min-w-[600px]">
                        <thead>
                            <tr class="bg-slate-50 text-slate-500 text-sm border-b border-slate-200">
                                <th class="px-6 py-3 font-semibold">Date</th>
                                <th class="px-6 py-3 font-semibold">Type</th>
                                <th class="px-6 py-3 font-semibold">Item Name</th>
                                <th class="px-6 py-3 font-semibold text-right">Amount</th>
                                <th class="px-6 py-3 font-semibold text-center w-20">Action</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100" id="table-body">
                            <!-- Rows injected by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ================= FORM VIEW ================= -->
        <div id="form-view" class="hidden max-w-xl mx-auto w-full pt-8">
            <div class="bg-white rounded-2xl shadow-lg border border-slate-100 overflow-hidden">
                <!-- Form Header -->
                <div id="form-header" class="px-6 py-5 text-white flex items-center gap-4 bg-blue-600 transition-colors duration-300">
                    <button onclick="showView('dashboard')" class="hover:bg-black/20 p-2 rounded-full transition-colors focus:outline-none">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <h2 class="text-xl font-bold" id="form-title">Add Record</h2>
                </div>
                
                <!-- Form Body -->
                <form id="record-form" class="p-6 md:p-8 space-y-5">
                    <input type="hidden" id="record-type" value="">
                    
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1" id="label-name">Item Name</label>
                        <input type="text" id="record-name" required placeholder="e.g., Consulting, Supplies..." 
                            class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Price/Amount ($)</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <span class="text-slate-500">$</span>
                            </div>
                            <input type="number" id="record-amount" required min="0.01" step="0.01" placeholder="0.00" 
                                class="w-full pl-8 pr-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Date</label>
                        <input type="date" id="record-date" required 
                            class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                    </div>
                    
                    <div class="pt-6">
                        <button type="submit" id="submit-btn" class="w-full py-3.5 px-4 text-white font-bold rounded-xl shadow-md transition-colors hover:opacity-90">
                            Save Record
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </main>

    <!-- Notification Toast (Hidden by default) -->
    <div id="toast" class="fixed bottom-4 right-4 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-800 text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-3 z-50">
        <i class="fa-solid fa-circle-check text-green-400"></i>
        <span id="toast-message">Record saved successfully!</span>
    </div>

    <!-- Application Logic -->
    <script>
        // --- State Management ---
        let records = [];
        const LOCAL_STORAGE_KEY = 'trackerProData';

        // --- DOM Elements ---
        const dashboardView = document.getElementById('dashboard-view');
        const formView = document.getElementById('form-view');
        const monthFilter = document.getElementById('month-filter');
        const tableBody = document.getElementById('table-body');
        const recordForm = document.getElementById('record-form');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');

        // --- Initialization ---
        function init() {
            loadData();
            setupMonthFilter();
            renderDashboard();
            
            // Set default date to today for the form
            document.getElementById('record-date').valueAsDate = new Date();
        }

        // --- Data Loading & Saving ---
        function loadData() {
            const storedData = localStorage.getItem(LOCAL_STORAGE_KEY);
            if (storedData) {
                records = JSON.parse(storedData);
            }
        }

        function saveData() {
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(records));
        }

        // --- View Navigation ---
        function showView(viewName) {
            if (viewName === 'dashboard') {
                dashboardView.classList.remove('hidden');
                formView.classList.add('hidden');
                renderDashboard();
            } else if (viewName === 'form') {
                dashboardView.classList.add('hidden');
                formView.classList.remove('hidden');
            }
        }

        function openForm(type) {
            const isSale = type === 'sale';
            
            // UI Updates based on type
            document.getElementById('form-title').innerText = isSale ? 'Add Sales Revenue' : 'Add Expense';
            document.getElementById('label-name').innerText = isSale ? 'Product/Service Name' : 'Expense Item Name';
            document.getElementById('record-type').value = type;
            
            const header = document.getElementById('form-header');
            const submitBtn = document.getElementById('submit-btn');
            
            if (isSale) {
                header.className = 'px-6 py-5 text-white flex items-center gap-4 bg-green-600 transition-colors duration-300';
                submitBtn.className = 'w-full py-3.5 px-4 text-white font-bold rounded-xl shadow-md transition-colors hover:opacity-90 bg-green-600 hover:bg-green-700';
            } else {
                header.className = 'px-6 py-5 text-white flex items-center gap-4 bg-red-600 transition-colors duration-300';
                submitBtn.className = 'w-full py-3.5 px-4 text-white font-bold rounded-xl shadow-md transition-colors hover:opacity-90 bg-red-600 hover:bg-red-700';
            }

            // Reset form fields except date
            document.getElementById('record-name').value = '';
            document.getElementById('record-amount').value = '';
            
            showView('form');
        }

        // --- Form Submission ---
        recordForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const type = document.getElementById('record-type').value;
            const name = document.getElementById('record-name').value;
            const amount = parseFloat(document.getElementById('record-amount').value);
            const date = document.getElementById('record-date').value;

            const newRecord = {
                id: generateId(),
                type: type,
                name: name,
                amount: amount,
                date: date
            };

            records.push(newRecord);
            saveData();
            
            // Reset and update month filter if a new month was introduced
            setupMonthFilter(date.substring(0, 7)); 
            
            showToast(type === 'sale' ? 'Revenue added successfully!' : 'Expense added successfully!');
            showView('dashboard');
        });

        // --- Delete Record ---
        function deleteRecord(id) {
            // Using a custom modal is better, but keeping it simple as requested without native alerts.
            // Automatically deleting upon click for seamless UX.
            records = records.filter(record => record.id !== id);
            saveData();
            renderDashboard();
            showToast('Record deleted.', 'bg-slate-700');
        }

        // --- Core Rendering Logic ---
        function renderDashboard() {
            const selectedMonth = monthFilter.value;
            
            // Filter records for selected month
            const filteredRecords = records.filter(r => r.date.startsWith(selectedMonth));
            
            // Sort by date (newest first)
            filteredRecords.sort((a, b) => new Date(b.date) - new Date(a.date));

            // Calculate Totals
            let totalRevenue = 0;
            let totalExpense = 0;

            filteredRecords.forEach(record => {
                if (record.type === 'sale') totalRevenue += record.amount;
                if (record.type === 'expense') totalExpense += record.amount;
            });

            const netProfit = totalRevenue - totalExpense;

            // Update UI Summary Cards
            document.getElementById('summary-revenue').innerText = formatCurrency(totalRevenue);
            document.getElementById('summary-expense').innerText = formatCurrency(totalExpense);
            
            const profitEl = document.getElementById('summary-profit');
            const profitIconContainer = document.getElementById('profit-icon-container');
            
            profitEl.innerText = formatCurrency(netProfit);
            
            if (netProfit > 0) {
                profitEl.className = 'text-2xl font-bold text-green-600';
                profitIconContainer.className = 'p-4 rounded-full bg-green-100 text-green-600';
            } else if (netProfit < 0) {
                profitEl.className = 'text-2xl font-bold text-red-600';
                profitIconContainer.className = 'p-4 rounded-full bg-red-100 text-red-600';
            } else {
                profitEl.className = 'text-2xl font-bold text-slate-800';
                profitIconContainer.className = 'p-4 rounded-full bg-slate-100 text-slate-600';
            }

            // Update Table Title & Count
            const dateObj = new Date(selectedMonth + '-01T00:00:00');
            const monthName = dateObj.toLocaleString('default', { month: 'long', year: 'numeric' });
            document.getElementById('table-title').innerText = `Transactions for ${monthName}`;
            document.getElementById('record-count').innerText = `${filteredRecords.length} record${filteredRecords.length !== 1 ? 's' : ''}`;

            // Render Table Rows
            tableBody.innerHTML = '';
            
            if (filteredRecords.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="px-6 py-12 text-center text-slate-400">
                            <i class="fa-solid fa-folder-open text-4xl mb-3 opacity-50"></i>
                            <p>No transactions found for this month.</p>
                            <p class="text-sm mt-1">Click the buttons above to add one.</p>
                        </td>
                    </tr>
                `;
                return;
            }

            filteredRecords.forEach(record => {
                const isSale = record.type === 'sale';
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition-colors group';
                
                tr.innerHTML = `
                    <td class="px-6 py-4 text-sm text-slate-600 whitespace-nowrap">
                        ${formatDate(record.date)}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold ${isSale ? 'bg-green-100 text-green-700 border border-green-200' : 'bg-red-100 text-red-700 border border-red-200'}">
                            ${isSale ? '<i class="fa-solid fa-arrow-trend-up mr-1.5"></i> Sale' : '<i class="fa-solid fa-arrow-trend-down mr-1.5"></i> Expense'}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-sm text-slate-800 font-medium">
                        ${escapeHTML(record.name)}
                    </td>
                    <td class="px-6 py-4 text-sm font-bold text-right whitespace-nowrap ${isSale ? 'text-green-600' : 'text-slate-800'}">
                        ${isSale ? '+' : '-'}${formatCurrency(record.amount)}
                    </td>
                    <td class="px-6 py-4 text-center">
                        <button onclick="deleteRecord('${record.id}')" class="text-slate-300 hover:text-red-500 transition-colors p-2 rounded-lg hover:bg-red-50 focus:outline-none" title="Delete">
                            <i class="fa-regular fa-trash-can"></i>
                        </button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // --- Helper Functions ---

        // Setup Month Dropdown based on data
        function setupMonthFilter(forceSelectMonth = null) {
            const currentMonth = new Date().toISOString().substring(0, 7); // YYYY-MM
            let months = new Set();
            
            // Add all months from records
            records.forEach(r => months.add(r.date.substring(0, 7)));
            
            // Always ensure current month is in the list
            months.add(currentMonth);
            
            // Convert to array and sort descending (newest first)
            months = Array.from(months).sort().reverse();
            
            // Preserve selection or use forced/current
            const currentSelection = forceSelectMonth || monthFilter.value || currentMonth;
            
            monthFilter.innerHTML = '';
            months.forEach(monthStr => {
                const option = document.createElement('option');
                option.value = monthStr;
                
                // Format for display (e.g., "October 2023")
                const dateObj = new Date(monthStr + '-01T00:00:00');
                option.textContent = dateObj.toLocaleString('default', { month: 'long', year: 'numeric' });
                
                if (monthStr === currentSelection) {
                    option.selected = true;
                }
                
                monthFilter.appendChild(option);
            });
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD'
            }).format(amount);
        }

        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            // Add time to prevent timezone offset issues showing previous day
            return new Date(dateString + 'T12:00:00').toLocaleDateString('en-US', options);
        }

        function generateId() {
            return Math.random().toString(36).substring(2, 9) + Date.now().toString(36);
        }

        // Prevent XSS in table display
        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Custom Toast Notification (Replaces alerts)
        let toastTimeout;
        function showToast(message, bgColorClass = 'bg-slate-800') {
            toastMessage.innerText = message;
            
            // Reset classes
            toast.className = `fixed bottom-4 right-4 transform transition-all duration-300 text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-3 z-50 ${bgColorClass}`;
            
            // Show
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-20', 'opacity-0');
            });
            
            // Hide after 3 seconds
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Run on load
        window.onload = init;

    </script>
</body>
</html>
